<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Linux Command Explorer · Cloud Edition</title>
<style>
  :root{
    --bg:#05070d; --panel:#101420; --border:#1e2a3d;
    --accent:#4fd1ff; --accent2:#a855f7; --green:#4ade80;
    --text:#e6edf7; --muted:#8a94a8;
    --mono:'JetBrains Mono',Consolas,Monaco,monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%}
  body{padding-bottom:70px;overflow-x:hidden}

  /* Background (simple, no mask/blur to avoid GPU bugs) */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 10% 0%, rgba(79,209,255,.12), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(168,85,247,.12), transparent 40%),
      linear-gradient(rgba(79,209,255,.04) 1px, transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg, rgba(79,209,255,.04) 1px, transparent 1px) 0 0/48px 48px,
      #05070d;
  }

  /* Hero */
  .hero{text-align:center;padding:60px 20px 20px}
  .logo{font-family:var(--mono);font-weight:700;font-size:1rem;color:var(--muted);margin-bottom:16px;letter-spacing:.5px}
  .logo .p{color:var(--green)}
  .logo .a{color:var(--accent)}
  .logo .cur{color:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .hero h1{
    font-size:clamp(1.9rem,5vw,3.4rem);font-weight:700;letter-spacing:-1px;
    background:linear-gradient(90deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero h1 .a{-webkit-text-fill-color:var(--accent2)}
  .subtitle{color:var(--muted);margin-top:10px;font-size:1rem}

  /* Search */
  .search-wrap{position:relative;max-width:560px;margin:28px auto 0}
  #search{
    width:100%;padding:15px 52px 15px 18px;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;color:var(--text);
    font-family:var(--mono);font-size:1rem;outline:none;transition:.2s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,209,255,.12)}
  .kbd{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:.8rem;color:var(--muted);
    border:1px solid var(--border);border-radius:6px;padding:3px 8px;
  }

  /* Stats */
  .stats{display:flex;justify-content:center;gap:36px;margin-top:28px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat span{font-family:var(--mono);font-size:1.7rem;font-weight:700;color:var(--accent);display:block}
  .stat small{color:var(--muted);font-size:.72rem;letter-spacing:1px;text-transform:uppercase}

  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:26px 20px 8px;max-width:1100px;margin:0 auto}
  .filter{
    padding:7px 16px;border-radius:999px;cursor:pointer;background:var(--panel);
    border:1px solid var(--border);color:var(--muted);font-family:var(--mono);
    font-size:.82rem;transition:.2s;user-select:none;
  }
  .filter:hover{color:var(--text);border-color:var(--accent)}
  .filter.active{background:var(--accent);color:#041018;font-weight:700;border-color:var(--accent)}

  /* Grid */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:16px;max-width:1200px;margin:16px auto;padding:20px;
  }
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px;cursor:pointer;transition:.25s;position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .card .name{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--accent);margin-bottom:6px;word-break:break-word}
  .card .name .d{color:var(--green);margin-right:4px}
  .card .desc{color:var(--muted);font-size:.88rem;line-height:1.5}
  .card .tag{
    display:inline-block;margin-top:12px;font-size:.7rem;padding:3px 9px;
    border-radius:999px;background:rgba(168,85,247,.15);color:var(--accent2);
    border:1px solid rgba(168,85,247,.3);font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.5px;
  }
  .card.cloud{border-color:rgba(168,85,247,.45)}
  .card.cloud .name{color:var(--accent2)}
  .card.cloud .tag{background:rgba(79,209,255,.15);color:var(--accent);border-color:rgba(79,209,255,.3)}

  /* Empty */
  .empty{text-align:center;color:var(--muted);padding:50px;font-family:var(--mono)}

  /* Modal */
  .backdrop{
    position:fixed;inset:0;z-index:100;background:rgba(3,6,12,.85);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .backdrop.show{display:flex}
  .modal{
    background:linear-gradient(160deg,#0f1420,#0a0e18);
    border:1px solid var(--border);border-radius:18px;padding:36px;
    max-width:700px;width:100%;max-height:85vh;overflow-y:auto;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
  }
  .modal-close{
    position:absolute;top:14px;right:14px;background:transparent;
    border:1px solid var(--border);color:var(--muted);width:34px;height:34px;
    border-radius:9px;cursor:pointer;font-size:1rem;transition:.2s;
  }
  .modal-close:hover{color:var(--accent);border-color:var(--accent)}
  .modal h2{font-family:var(--mono);font-size:1.5rem;color:var(--accent);margin-bottom:6px;word-break:break-word}
  .modal .meta{color:var(--accent2);font-family:var(--mono);font-size:.82rem;margin-bottom:18px}
  .modal h3{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:22px 0 10px}
  .modal p{color:var(--text);line-height:1.65;font-size:.92rem}
  .modal ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .modal ul li{
    background:rgba(79,209,255,.05);border:1px solid var(--border);
    border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;
    font-family:var(--mono);font-size:.82rem;word-break:break-word;
  }
  .modal .detail-list li{border-left-color:var(--accent2);font-family:var(--sans)}
  .modal .detail-list li strong{color:var(--accent);font-family:var(--mono)}

  footer{
    position:fixed;bottom:0;left:0;right:0;text-align:center;padding:12px;
    font-size:.78rem;color:var(--muted);background:rgba(5,7,13,.95);
    font-family:var(--mono);border-top:1px solid var(--border);
  }
  @media(max-width:600px){
    .hero{padding-top:40px}
    .stats{gap:22px}
    .modal{padding:26px 20px}
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="logo"><span class="p">$</span> linux<span class="a">::</span>cloud <span class="cur">_</span></div>
    <h1>Linux Command <span class="a">Explorer</span></h1>
    <p class="subtitle">Interactive reference for Linux &amp; Cloud Computing components</p>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search commands... (press /)" autocomplete="off" />
      <span class="kbd">/</span>
    </div>
    <div class="stats">
      <div class="stat"><span id="statTotal">0</span><small>Commands</small></div>
      <div class="stat"><span id="statCats">0</span><small>Categories</small></div>
      <div class="stat"><span id="statCloud">0</span><small>Cloud</small></div>
    </div>
  </header>

  <nav class="filters" id="filters"></nav>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty" style="display:none">No commands match your search.</div>

  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>Static · Deployed via GitHub Pages · <span id="year"></span></footer>

<script>
/* ============ DATA ============ */
const LINUX_COMMANDS = [
// ==================== FILES & DIRECTORIES ====================
{name:"ls",category:"Files",short:"List directory contents.",
   description:"The ls command lists files and directories. It is one of the most frequently used commands for exploring the filesystem.",
   syntax:["ls -lah","ls -la","ls -lh /var/log"],
   details:[{flag:"-l",text:"Long format with permissions, owner, size and timestamp."},
            {flag:"-a",text:"Include hidden files beginning with a dot."},
            {flag:"-h",text:"Human-readable file sizes."},
            {flag:"-R",text:"Recursively list subdirectories."},
            {flag:"-d */",text:"All the directory (not file)"},
            {flag:"Documents/",text:"Only specific folder"},
            {flag:"Documents/*.py",text:"Only specific folder and python"},
   ]},
{name:"pwd",category:"Files",short:"Print the current working directory.",
   description:"pwd outputs the absolute path of the directory you are currently in. Useful for orientation after navigating with cd.",
   syntax:["pwd"],
   details:[{flag:"-P",text:"Print the physical path, resolving all symlinks."}]},
{name:"cd",category:"Files",short:"Change the current working directory.",
   description:"cd changes the shell's current directory. With no arguments it returns to the home directory.",
   syntax:["cd [path]","cd -","cd ..","cd ~"],
   details:[{flag:"cd ..",text:"Move up one directory level."},
            {flag:"cd -",text:"Switch to the previous directory."},
            {flag:"cd ~",text:"Go to the current user's home directory."},
            {flag:"cd 'My Book'",text:"Space control."},
   ]},
{name:"mkdir",category:"Files",short:"Create new directories.",
   description:"mkdir creates one or more directories. Use -p to create parent directories as needed.",
   syntax:["mkdir dirname","mkdir -p project/{src,docs,tests}"],
   details:[{flag:"-p",text:"Create parent directories if they don't exist, no error if present."},
            {flag:"-v",text:"Print a message for each created directory."},
            {flag:" names/{jehan,hasan,adib}",text:"Multiple directory create."}
   ]},
{name:"rmdir",category:"Files",short:"Remove empty directories.",
   description:"rmdir deletes empty directories. It fails if the directory contains files or subdirectories.",
   syntax:["rmdir dirname","rmdir dirname/*",],
   details:[{flag:"-p",text:"Remove directory and its ancestors if they become empty."}]},
{name:"cp",category:"Files",short:"Copy files and directories.",
   description:"cp creates copies of files or directory trees. Use -r for recursive directory copying.",
   syntax:["cp -a source/ backup/","cp -r dir1 dir2"],
   details:[{flag:"-r",text:"Recursively copy directories."},
            {flag:"-a",text:"Archive mode: preserve permissions, ownership, timestamps, symlinks."},
            {flag:"-p",text:"Preserve file attributes and timestamps."},
            {flag:"-i",text:"Prompt before overwriting."}]},
{name:"mv",category:"Files",short:"Move or rename files and directories.",
   description:"mv relocates a file or directory to a new path, or renames it if the destination is a new name in the same location.",
   syntax:["mv source dest","mv draft.txt final.txt"],
   details:[{flag:"-i",text:"Prompt before overwriting."},
            {flag:"-n",text:"Never overwrite existing files."},
            {flag:"-v",text:"Verbose output showing moves."}]},
{name:"rm",category:"Files",short:"Remove files and directories.",
   description:"rm deletes files. Directories require -r. This is destructive — there is no built-in trash or undo.",
   syntax:["rm [options] file","rm -rf build/"],
   details:[{flag:"-r",text:"Recursively delete directories."},
            {flag:"-f",text:"Force removal without prompts."},
            {flag:"-i",text:"Prompt before each removal (safer)."}]},
{name:"touch",category:"Files",short:"Create empty files or update timestamps.",
   description:"touch creates a new empty file if it doesn't exist, or updates the access/modification time of an existing file.",
   syntax:["touch notes.txt","touch -t 202401011200 file.txt"],
   details:[{flag:"-a",text:"Change only the access time."},
            {flag:"-m",text:"Change only the modification time."}]},
{name:"ln",category:"Files",short:"Create links between files.",
   description:"ln creates hard links (default) or symbolic links (-s) to files or directories. Symlinks are common for atomic release switching.",
   syntax:["ln -s /opt/app/releases/v2 /opt/app/current","ln file1 file2"],
   details:[{flag:"-s",text:"Create a symbolic (soft) link."},
            {flag:"-f",text:"Force overwrite of existing destination."}]},
{name:"tree",category:"Files",short:"Display directory structure as a tree.",
   description:"tree recursively lists directories and files in a visual tree format. May require installation.",
   syntax:["tree -L 2 -a","tree"],
   details:[{flag:"-L",text:"Limit recursion depth."},
            {flag:"-a",text:"Include hidden entries."},
            {flag:"-d",text:"List directories only."}]},
{name:"stat",category:"Files",short:"Display detailed file status.",
   description:"stat shows file metadata including size, permissions, timestamps, inode, and device information.",
   syntax:["stat file.txt"],
   details:[{flag:"-c",text:"Use a custom output format."},
            {flag:"%s",text:"File size in bytes."},
            {flag:"%a",text:"Access rights in octal."}]},
{name:"file",category:"Files",short:"Determine file type.",
   description:"file examines file contents and reports the type (e.g., ASCII text, ELF executable, PNG image) rather than relying on extension.",
   syntax:["file mystery.bin","file document.txt"],
   details:[{flag:"-b",text:"Brief mode — omit the filename from output."},
            {flag:"-i",text:"Output MIME type string."}]},
{name:"realpath",category:"Files",short:"Resolve a path to its canonical absolute form.",
   description:"realpath resolves a path to its canonical absolute form, following symlinks and removing .. segments.",
   syntax:["realpath ./config/../app.conf"],
   details:[{flag:"-e",text:"All path components must exist."}]},
{name:"basename",category:"Files",short:"Strip directory and suffix from filenames.",
   description:"basename returns the final component of a path, optionally removing a given suffix. Useful in scripts for extracting filenames.",
   syntax:["basename /path/to/file.txt","basename file.txt .txt"],
   details:[{flag:"suffix",text:"Remove the specified suffix from the result."}]},
{name:"dirname",category:"Files",short:"Strip the last component from a path.",
   description:"dirname returns the directory portion of a file path, removing the filename. The counterpart to basename.",
   syntax:["dirname /path/to/file.txt"],
   details:[{flag:"-z",text:"Separate output with NUL instead of newline."}]},
{name:"locate",category:"Files",short:"Quickly find files using a prebuilt database.",
   description:"locate searches a database of filenames for fast results. The database is updated by updatedb (often via cron).",
   syntax:["locate nginx.conf","locate -i pattern"],
   details:[{flag:"-i",text:"Case-insensitive search."},
            {flag:"-n",text:"Limit the number of results."}]},

// ==================== VIEWING & TEXT PROCESSING ====================
{name:"cat",category:"Text",short:"Concatenate and display file content.",
   description:"cat reads files and prints their contents to stdout. Also used to combine multiple files.",
   syntax:["cat > new_file_create.txt __WRITE_HERE__ (create new file/overwrite)","cat >> new_file_create.txt __WRITE_HERE__ (append)","cat file.txt (read file)","cat -n file.txt","cat a.txt b.txt > joined.txt","cat a.txt >> b.txt"],
   details:[{flag:"-b",text:"Number output lines. (non-blank)"},{flag:"-n",text:"Number output lines."},{flag:"-A",text:"Show non-printing characters."}]},
{name:"less",category:"Text",short:"Page through file content interactively.",
   description:"less opens a scrollable viewer for large files. Press / to search, q to quit.",
   syntax:["less file","less +F /var/log/syslog"],
   details:[{flag:"/pattern",text:"Search forward."},{flag:"G",text:"Jump to end of file."},{flag:"q",text:"Quit the pager."},
            {flag:"+F",text:"Follow like tail -f; Ctrl+C to stop following."}]},
{name:"head",category:"Text",short:"Display the first lines of a file.",
   description:"head shows the beginning of files, useful for quickly previewing large files or logs.",
   syntax:["head -n 20 file.txt","head file"],
   details:[{flag:"-n",text:"Number of lines to show (default 10)."},
            {flag:"-c",text:"Number of bytes to show."}]},
{name:"tail",category:"Text",short:"Display the last lines of a file.",
   description:"tail shows the end of files. With -f it follows new writes — essential for watching logs live.",
   syntax:["tail -f /var/log/nginx/access.log","tail -n 50 file"],
   details:[{flag:"-f",text:"Follow file as it grows."},{flag:"-F",text:"Follow and survive log rotation."},{flag:"-n",text:"Show the last N lines."}]},
{name:"wc",category:"Text",short:"Count lines, words, and characters.",
   description:"wc counts bytes, words, and lines in files or standard input. Commonly used to count output lines.",
   syntax:["wc -l file.txt","cat file | wc -w"],
   details:[{flag:"-l",text:"Count lines only."},
            {flag:"-w",text:"Count words only."},
            {flag:"-c",text:"Count bytes only."}]},
{name:"sort",category:"Text",short:"Sort lines of text files.",
   description:"sort orders lines alphabetically, numerically, or in reverse. Essential for organizing output before further processing.",
   syntax:["sort file.txt","sort -n file","sort -nr file"],
   details:[{flag:"-n",text:"Numeric sort."},
            {flag:"-r",text:"Reverse order."},
            {flag:"-u",text:"Unique — remove duplicates."},
            {flag:"-k",text:"Sort by a specific field."}]},
{name:"uniq",category:"Text",short:"Report or omit repeated lines.",
   description:"uniq filters adjacent duplicate lines. Usually paired with sort to count or deduplicate occurrences.",
   syntax:["sort file.txt | uniq -c | sort -nr | head"],
   details:[{flag:"-c",text:"Prefix lines with occurrence count."},
            {flag:"-d",text:"Only print duplicate lines."},
            {flag:"-u",text:"Only print unique lines."}]},
{name:"cut",category:"Text",short:"Extract sections from each line.",
   description:"cut removes sections from each line of files, selecting by character, byte, or delimiter-separated field.",
   syntax:["cut -d: -f1,7 /etc/passwd","cut -c1-10 file"],
   details:[{flag:"-d",text:"Delimiter character."},
            {flag:"-f",text:"Field(s) to extract."},
            {flag:"-c",text:"Character positions."}]},
{name:"awk",category:"Text",short:"Pattern-scanning and reporting language.",
   description:"awk processes text line by line, splitting into fields and applying expressions — great for extraction and reports.",
   syntax:["awk '{print $1}' access.log","awk -F: '{print $1}' /etc/passwd"],
   details:[{flag:"-F",text:"Set the field separator."},
            {flag:"$1",text:"Reference the first field."},
            {flag:"NR",text:"Current line number."}]},
{name:"sed",category:"Text",short:"Stream editor for text transformation.",
   description:"sed performs substitutions and edits on a stream. The s/// command is the most common.",
   syntax:["sed -i 's/old/new/g' config.txt","sed 's/old/new/g' file"],
   details:[{flag:"-i",text:"Edit files in place."},
            {flag:"-i.bak",text:"Edit in place and keep a backup."},
            {flag:"s///g",text:"Global substitution."},
            {flag:"-n",text:"Suppress default output."}]},
{name:"tr",category:"Text",short:"Translate or delete characters.",
   description:"tr translates or deletes characters from standard input, commonly used to change case or strip characters.",
   syntax:["tr 'a-z' 'A-Z' < input.txt"],
   details:[{flag:"-d",text:"Delete specified characters."},
            {flag:"-s",text:"Squeeze repeated characters."}]},
{name:"diff",category:"Text",short:"Compare files line by line.",
   description:"diff shows differences between two files. The -u flag produces unified format, the same style used by git and patch.",
   syntax:["diff -u old.conf new.conf"],
   details:[{flag:"-u",text:"Unified diff format."},
            {flag:"-r",text:"Recursively compare directories."}]},
{name:"tee",category:"Text",short:"Read stdin and write to stdout and files.",
   description:"tee splits output, writing it to both the terminal and one or more files. Useful with sudo for writing to root-owned files.",
   syntax:["echo \"data\" | sudo tee /etc/example.conf"],
   details:[{flag:"-a",text:"Append instead of overwrite."}]},
{name:"xargs",category:"Text",short:"Build command lines from standard input.",
   description:"xargs reads items from stdin and executes a command with them as arguments. Pairs with find for batch operations.",
   syntax:["find . -name \"*.tmp\" -print0 | xargs -0 rm"],
   details:[{flag:"-0",text:"Input items are NUL-separated (safe for spaces)."},
            {flag:"-n",text:"Max arguments per command."},
            {flag:"-P",text:"Run commands in parallel."}]},
{name:"column",category:"Text",short:"Format text into aligned columns.",
   description:"column aligns delimited text into neat columns, making tabular output readable.",
   syntax:["column -t -s: /etc/passwd"],
   details:[{flag:"-t",text:"Create a table."},
            {flag:"-s",text:"Input delimiter."}]},
{name:"jq",category:"Text",short:"Command-line JSON processor.",
   description:"jq parses, filters, and pretty-prints JSON from the terminal. Essential for working with API responses.",
   syntax:["curl -s https://api.example.com/items | jq '.items[].name'"],
   details:[{flag:".",text:"Identity filter — pretty-print."},
            {flag:".[]",text:"Iterate array elements."},
            {flag:"-r",text:"Raw output (no quotes)."}]},
{name:"paste",category:"Text",short:"Merge lines of files side by side.",
   description:"paste joins files horizontally, combining corresponding lines with a delimiter (tab by default).",
   syntax:["paste file1 file2","paste -d, file1 file2"],
   details:[{flag:"-d",text:"Specify delimiter."},
            {flag:"-s",text:"Serial mode — one file per output line."}]},
{name:"split",category:"Text",short:"Split a file into pieces.",
   description:"split divides a large file into smaller chunks by size or line count, useful for transferring or processing large data.",
   syntax:["split -b 100M largefile","split -l 1000 file"],
   details:[{flag:"-b",text:"Size per output file."},
            {flag:"-l",text:"Lines per output file."}]},
{name:"comm",category:"Text",short:"Compare two sorted files line by line.",
   description:"comm shows lines unique to each file and lines common to both. Both input files must be sorted.",
   syntax:["comm file1 file2"],
   details:[{flag:"-1",text:"Suppress lines unique to file1."},
            {flag:"-2",text:"Suppress lines unique to file2."},
            {flag:"-3",text:"Suppress lines common to both."}]},

// ==================== SEARCHING ====================
{name:"find",category:"Search",short:"Search for files in a directory hierarchy.",
   description:"find walks a directory tree matching name, size, time, permissions and can execute commands on matches.",
   syntax:["find . -type f -name \"*.log\" -mtime -7","find / -type f -size +100M 2>/dev/null","find . -type f -name \"*.sh\" -exec chmod +x {} +"],
   details:[{flag:"-name",text:"Match filename by pattern."},
            {flag:"-type",text:"Filter by file type (f=file, d=directory)."},
            {flag:"-mtime",text:"Filter by modification time in days."},
            {flag:"-exec",text:"Run a command on each match; '+' batches files."},
            {flag:"-perm",text:"Filter by permission bits (e.g., -4000 setuid)."}]},
{name:"grep",category:"Search",short:"Search text using regular expressions.",
   description:"grep prints lines matching a pattern. It supports regex, recursive search and context lines.",
   syntax:["grep -rniE \"error|fail\" /var/log","grep -c \"404\" access.log","grep -v \"^#\" config.conf"],
   details:[{flag:"-r",text:"Recursively search directories."},
            {flag:"-n",text:"Show line numbers."},
            {flag:"-i",text:"Case-insensitive matching."},
            {flag:"-v",text:"Invert match."},
            {flag:"-E",text:"Extended regular expressions."},
            {flag:"-c",text:"Count matching lines."}]},
{name:"rg",category:"Search",short:"ripgrep — fast recursive search.",
   description:"rg is a very fast recursive search that respects .gitignore by default. Restrict by language with --type.",
   syntax:["rg \"TODO\" --type py"],
   details:[{flag:"--type",text:"Restrict to a language/file type."},
            {flag:"-i",text:"Case-insensitive."},
            {flag:"-n",text:"Show line numbers."}]},
{name:"which",category:"Search",short:"Show the full path of a command.",
   description:"which identifies which executable will run when you type a command name, based on your PATH. 'type -a name' also reveals aliases and functions.",
   syntax:["which python3","which ls"],
   details:[]},

/* ============ APP ============ */
(function(){
  const ALL = [...LINUX_COMMANDS, ...CLOUD_COMMANDS];
  const grid = document.getElementById('grid');
  const filtersEl = document.getElementById('filters');
  const searchEl = document.getElementById('search');
  const emptyEl = document.getElementById('empty');
  const backdrop = document.getElementById('backdrop');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');

  let activeCategory = 'All';
  let query = '';

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function buildFilters(){
    const cats = ['All', ...new Set(ALL.map(c => c.category))];
    filtersEl.innerHTML = cats.map(cat =>
      `<button class="filter${cat==='All'?' active':''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
    ).join('');
    filtersEl.querySelectorAll('.filter').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        filtersEl.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });
  }

  function updateStats(){
    document.getElementById('statTotal').textContent = ALL.length;
    document.getElementById('statCats').textContent = new Set(ALL.map(c => c.category)).size;
    document.getElementById('statCloud').textContent = CLOUD_COMMANDS.length;
  }

  function render(){
    const q = query.toLowerCase();
    const list = ALL.filter(item => {
      const matchesCat = activeCategory === 'All' || item.category === activeCategory;
      const hay = (item.name+' '+item.short+' '+item.description+' '+
        item.details.map(d => d.flag+' '+d.text).join(' ')).toLowerCase();
      return matchesCat && (q === '' || hay.includes(q));
    });

    emptyEl.style.display = list.length ? 'none' : 'block';

    grid.innerHTML = list.map(item => {
      const idx = ALL.indexOf(item);
      return `<article class="card ${item.cloud?'cloud':''}" data-idx="${idx}">
        <div class="name"><span class="d">$</span>${escapeHtml(item.name)}</div>
        <div class="desc">${escapeHtml(item.short)}</div>
        <span class="tag">${escapeHtml(item.category)}</span>
      </article>`;
    }).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openModal(ALL[+card.dataset.idx]));
    });
  }

  function openModal(item){
    modalBody.innerHTML = `
      <h2>${escapeHtml(item.name)}</h2>
      <div class="meta">Category: ${escapeHtml(item.category)}${item.cloud?' · Cloud Component':''}</div>
      <p>${escapeHtml(item.description)}</p>
      <h3>Syntax &amp; Usage</h3>
      <ul>${item.syntax.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
      <h3>Key Details</h3>
      <ul class="detail-list">${item.details.map(d =>
        `<li><strong>${escapeHtml(d.flag)}</strong> — ${escapeHtml(d.text)}</li>`).join('')}</ul>
    `;
    backdrop.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    backdrop.classList.remove('show');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === '/' && document.activeElement !== searchEl){
      e.preventDefault(); searchEl.focus();
    }
  });
  searchEl.addEventListener('input', e => {
    query = e.target.value.trim(); render();
  });

  buildFilters();
  updateStats();
  render();
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
